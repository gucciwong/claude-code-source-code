name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # See ci.yml — `npm ci` fails on cross-platform rollup optional deps.
        run: npm install --no-audit --no-fund

      - name: Build desktop app
        run: cd apps/desktop && npm run build

      - name: Run tests
        run: cd apps/desktop && npm test
