name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  desktop-tests:
    name: Desktop Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        # Use `npm install` not `npm ci` because npm has a bug
        # (https://github.com/npm/cli/issues/4828) where the package-lock.json
        # only records optionalDependencies for the platform that generated it.
        # Rollup ships per-platform native binaries via optionalDeps, so a
        # Windows-generated lockfile blows up on Linux runners with
        # "Cannot find module @rollup/rollup-linux-x64-gnu".
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

  extension-tests:
    name: VS Code Extension Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json

      - name: Install dependencies
        # Use `npm install` not `npm ci` because npm has a bug
        # (https://github.com/npm/cli/issues/4828) where the package-lock.json
        # only records optionalDependencies for the platform that generated it.
        # Rollup ships per-platform native binaries via optionalDeps, so a
        # Windows-generated lockfile blows up on Linux runners with
        # "Cannot find module @rollup/rollup-linux-x64-gnu".
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
