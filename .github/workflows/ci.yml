name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  desktop-tests:
    name: Desktop Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        # npm/cli#4828: package-lock.json only records optionalDependencies
        # for the platform that generated it (Windows). On Linux runners
        # `@rollup/rollup-linux-x64-gnu` is missing, so we wipe lockfile +
        # node_modules and force `--include=optional` to make npm re-resolve
        # rollup's per-platform native binaries fresh.
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --include=optional --no-audit --no-fund

      - name: Run tests
        run: npm test

  extension-tests:
    name: VS Code Extension Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json

      - name: Install dependencies
        # npm/cli#4828: package-lock.json only records optionalDependencies
        # for the platform that generated it (Windows). On Linux runners
        # `@rollup/rollup-linux-x64-gnu` is missing, so we wipe lockfile +
        # node_modules and force `--include=optional` to make npm re-resolve
        # rollup's per-platform native binaries fresh.
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --include=optional --no-audit --no-fund

      - name: Run tests
        run: npm test
