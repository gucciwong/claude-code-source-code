# W4-T10 — Multi-service pytest matrix.
#
# Closes the long-standing gap where 18 Python services had zero CI coverage
# (only `apps/desktop` + `apps/vscode-extension` had jobs in `ci.yml`).
# Each service runs its own pytest suite in parallel; a separate job runs the
# shared `services/_shared` package tests.
#
# Matrix is intentionally flat (one job per service) so:
#   - failures fingerprint the exact service in the GitHub UI
#   - per-service pip cache keys (`requirements.txt` hash) make repeat runs fast
#   - `fail-fast: false` keeps unrelated services running on a single regression

name: Services CI

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/services-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-package-tests:
    name: _shared (auth + utils)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest 'fastapi>=0.109' 'httpx>=0.27' 'starlette' 'python-multipart'
      - name: Run _shared tests
        run: |
          PYTHONPATH="${PYTHONPATH}:${PWD}/services" \
            python -m pytest services/_shared/tests -q

  service-tests:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: shared-package-tests
    strategy:
      fail-fast: false
      matrix:
        service:
          - analytics-service
          - award-service
          - code-completion-service
          - enterprise-data-service
          - execution-trace-service
          - federation-service
          - knowledge-service
          - memory-service
          - messaging-bridge-service
          - model-manager
          - orchestration-service
          - org-intelligence-service
          - persona-council-service
          - plugin-registry-service
          - pr-review-service
          - semantic-search-service
          - training-service
          - voice-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install service deps
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Defensive — some services don't list test deps in their
          # requirements.txt but the new W3-T8d test_auth_guards.py needs them.
          pip install pytest 'fastapi>=0.109' 'httpx>=0.27' 'python-multipart'

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        env:
          # The W3-T8d auth tests set their own token via monkeypatch; clearing
          # any developer-leaked env keeps the suite hermetic.
          SOVEREIGN_LOCAL_TOKEN: ''
          SOVEREIGN_LOCAL_TOKEN_FILE: ''
          # services/_shared must be importable for the auth-guard tests.
          PYTHONPATH: ${{ github.workspace }}/services
        run: |
          if [ -d tests ] && [ -n "$(find tests -maxdepth 2 -name 'test_*.py' -print -quit)" ]; then
            python -m pytest tests -q
          else
            echo "::warning::No tests found for ${{ matrix.service }} — skipping pytest"
          fi
