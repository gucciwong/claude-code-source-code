[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-coder-training"
version = "0.1.0"
description = "Training data collection and fine-tuning orchestration for Sovereign Coder"
readme = "README.md"
authors = [{name = "Sovereign AI Labs"}]
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "python-multipart==0.0.6",
    "pydantic==2.4.2",
    "sqlalchemy==2.0.23",
    "alembic==1.13.0",
    "python-dotenv==1.0.0",
    "datasets==2.14.6",
    "pyarrow==14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
]

training = [
    "torch==2.1.0",
    "transformers==4.36.0",
    "peft==0.7.0",
    "bitsandbytes==0.41.0",
    "accelerate==0.25.0",
    "optimum==1.17.0",
]

[tool.pytest.ini_options]
testpaths = ["training_data"]
addopts = "-v --cov=training_data --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py310']
