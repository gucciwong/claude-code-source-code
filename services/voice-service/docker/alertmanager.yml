global:
  resolve_timeout: 5m

# Alertmanager routing configuration
route:
  receiver: 'default'
  group_by: ['alertname', 'severity', 'instance']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  
  # Route for critical alerts
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 30m
    
    - match:
        severity: warning
      receiver: 'warning'
      repeat_interval: 2h

# Receivers (notification targets)
receivers:
  - name: 'default'
    # Add your notification integrations here
    # email_configs:
    #   - to: 'ops@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager@example.com'
    #     auth_password: 'password'
    
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#alerts'
    #     title: 'VibeVoice Alert'
    #     text: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.description }}'

  - name: 'critical'
    # PagerDuty for critical alerts
    # pagerduty_configs:
    #   - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'

  - name: 'warning'
    # Slower notification for warnings

# Inhibition rules (suppress certain alerts)
inhibit_rules:
  # Don't notify about low scores if service is down
  - source_match:
      severity: 'critical'
      alertname: 'InstanceUnavailable'
    target_match:
      severity: 'warning'
    equal: ['instance']
  
  # Don't spam low throughput if service is experiencing errors
  - source_match:
      severity: 'critical'
      alertname: 'HighErrorRate'
    target_match:
      severity: 'warning'
      alertname: 'LowThroughput'
