global
    log stdout local0
    maxconn 4096
    daemon
    
    # SSL defaults
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    tune.ssl.default-dh-param 2048

# Default settings for all frontends and backends
defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Stats page
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats admin if TRUE

# Main frontend - handles all incoming traffic
frontend vibevoice_frontend
    bind *:8000
    option forwardfor
    default_backend vibevoice_backend
    
    # Logging
    log global
    option httplog
    
    # Capture request timing
    capture request header Host len 64
    capture request header User-Agent len 128
    
    # WebSocket upgrade handling
    option http-server-close
    balance roundrobin

# Backend with load balancing across 3 instances
backend vibevoice_backend
    # Load balancing algorithm: round-robin with connection tracking
    balance roundrobin
    
    # Session persistence using cookies (optional)
    # cookie SERVERID insert indirect nocache
    
    # Health check settings
    option httpchk GET /health/ready
    timeout check 5000
    default-server inter 5s fall 3 rise 2
    
    # Logging and timeouts
    log global
    option httplog
    option forwardfor
    
    # Rate limiting (optional - 50 req/sec per server)
    rate-limit sessions 1000
    
    # Server definitions with health checks
    server instance1 vibevoice-1:8000 check weight 100
    server instance2 vibevoice-2:8000 check weight 100
    server instance3 vibevoice-3:8000 check weight 100
    
    # Retry policy: try up to 3 times on server error
    option redispatch
    retries 3
    
    # Sticky sessions for WebSocket (optional)
    # Use source IP-based persistence for WebSocket connections
    # stick-table type ip size 100k expire 30m
    # stick on src

# WebSocket-specific backend with longer timeouts
backend vibevoice_websocket
    balance roundrobin
    
    # Extended timeouts for WebSocket connections
    timeout tunnel 3600000
    timeout client-fin 30000
    
    # WebSocket-specific health check
    option httpchk GET /health/ready
    default-server inter 5s fall 3 rise 2
    
    server instance1 vibevoice-1:8000 check weight 100
    server instance2 vibevoice-2:8000 check weight 100
    server instance3 vibevoice-3:8000 check weight 100
    
    option redispatch
    retries 3
    
    # Sticky sessions for WebSocket client affinity
    stick-table type ip size 100k expire 24h
    stick on src

# Frontend for WebSocket connections (optional separate config)
frontend vibevoice_websocket_frontend
    bind *:8001
    # Use the WebSocket-specific backend
    default_backend vibevoice_websocket
    
    # WebSocket-specific settings
    option forwardfor
    option http-server-close
    
    log global
    option httplog
    capture request header Host len 64
    capture request header User-Agent len 128
    capture request header Sec-WebSocket-Key len 64

# API monitoring endpoint
frontend monitoring
    bind *:8080
    stats enable
    stats uri /admin/stats
    stats refresh 30s
    stats show-legends
    stats show-node
    
    http-request use-service prometheus-exporter if { path /metrics }
    default_backend stats_backend

backend stats_backend
    stats uri /stats
