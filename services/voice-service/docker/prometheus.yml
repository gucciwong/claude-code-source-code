global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'vibevoice-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # VibeVoice main service
  - job_name: 'vibevoice'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 'localhost:8000'
        labels:
          instance: 'vibevoice-main'
      - targets:
          - 'vibevoice-1:8000'
          - 'vibevoice-2:8000'
          - 'vibevoice-3:8000'
        labels:
          service: 'vibevoice-service'

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']
        labels:
          service: 'redis-cache'

  # HAProxy stats
  - job_name: 'haproxy'
    static_configs:
      - targets: ['localhost:8404']
        labels:
          service: 'haproxy-lb'

  # Node Exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          service: 'system-metrics'

  # NVIDIA GPU metrics (if using NVIDIA exporter)
  - job_name: 'nvidia_gpu'
    static_configs:
      - targets: ['localhost:9445']
        labels:
          service: 'gpu-metrics'
