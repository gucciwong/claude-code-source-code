apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibevoice
  namespace: default
  labels:
    app: vibevoice
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vibevoice
  template:
    metadata:
      labels:
        app: vibevoice
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: vibevoice
        image: vibevoice:latest
        imagePullPolicy: IfNotPresent
        
        # Container ports
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        # Resource requests and limits
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: "1"
        
        # Environment variables
        env:
        - name: INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: REDIS_HOST
          value: "redis.default.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        - name: WHISPER_MODEL_SIZE
          value: "base"
        - name: WHISPER_COMPUTE_TYPE
          value: "default"
        - name: DEVICE
          value: "auto"
        - name: LOG_LEVEL
          value: "INFO"
        - name: MAX_MODEL_MEMORY_GB
          value: "8"
        - name: VAD_AGGRESSIVENESS
          value: "2"
        - name: SILENCE_THRESHOLD_MS
          value: "800"
        - name: MIN_UTTERANCE_DURATION_MS
          value: "500"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Volume mounts
        volumeMounts:
        - name: cache
          mountPath: /root/.cache/huggingface
        - name: models
          mountPath: /models
        - name: tmp
          mountPath: /tmp
      
      # Init container for setup
      initContainers:
      - name: setup
        image: vibevoice:latest
        command: ["python", "-c", "from voice_service.models.whisper import WhisperASR; WhisperASR('base')"]
        volumeMounts:
        - name: cache
          mountPath: /root/.cache/huggingface
      
      # Volumes
      volumes:
      - name: cache
        emptyDir:
          sizeLimit: 10Gi
      - name: models
        emptyDir:
          sizeLimit: 10Gi
      - name: tmp
        emptyDir:
          sizeLimit: 5Gi
      
      # Node affinity for GPU nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: accelerator
                operator: In
                values:
                - nvidia-gpu
      
      # Tolerations for GPU taints
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
