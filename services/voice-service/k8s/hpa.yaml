apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vibevoice-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vibevoice
  minReplicas: 3
  maxReplicas: 10
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metric: active sessions
  - type: Pods
    pods:
      metric:
        name: vibevoice_active_sessions
      target:
        type: AverageValue
        averageValue: "10"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vibevoice-scaling-config
  namespace: default
data:
  scaling-rules.json: |
    {
      "scaling_targets": {
        "cpu_threshold_percent": 70,
        "memory_threshold_percent": 80,
        "max_sessions_per_instance": 10,
        "desired_concurrent_users": 6
      },
      "scaling_times": {
        "scale_up_delay_seconds": 60,
        "scale_down_delay_seconds": 300,
        "max_instances": 10,
        "min_instances": 3
      },
      "instance_capacity": {
        "instance_max_concurrent_users": 2,
        "instance_max_sessions": 10,
        "instance_memory_gb": 8
      }
    }
