  redis:
    image: redis:7.2-alpine
    container_name: sovereign-redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sovereign-network
    volumes:
      - redis-data:/data

  # ─── W6-T17 Observability stack ───────────────────────────────────────
  # Prometheus scrapes every Sovereign service's /metrics (added by W6-T17).
  # Grafana visualizes; Loki + promtail capture the JSON log lines emitted
  # by `_shared.logging` (W6-T18). Tagged with profile=observability so
  # `docker compose --profile observability up` opt-in starts them; default
  # `docker compose up` doesn't burn resources for users who don't want them.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sovereign-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - sovereign-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sovereign-grafana
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - sovereign-network

  loki:
    image: grafana/loki:3.2.0
    container_name: sovereign-loki
    restart: unless-stopped
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - sovereign-network

  promtail:
    image: grafana/promtail:3.2.0
    container_name: sovereign-promtail
    restart: unless-stopped
    profiles: ["observability"]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - sovereign-network

volumes:
  voice-cache:
  redis-data:
  knowledge-cache:
  prometheus-data:
  grafana-data:
  loki-data:
  # SQLite persistence for the W6-T16 registry services (Codex review, PR #1)
  memory-data:
  federation-data:
  plugin-registry-data:

networks:
  sovereign-network:
    driver: bridge
