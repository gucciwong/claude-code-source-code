version: '3.8'

services:
  voice-service:
    build:
      context: ./services/voice-service
      dockerfile: Dockerfile
    container_name: sovereign-voice-service
    ports:
      - "8000:8000"
    environment:
      # Service Configuration
      PORT: 8000
      LOG_LEVEL: INFO
      
      # Device Configuration
      DEVICE: cpu  # Change to 'cuda' if GPU available
      WHISPER_MODEL_SIZE: base
      WHISPER_COMPUTE_TYPE: default
      
      #  TTS Configuration
      TTS_DEFAULT_LANG: en
      TTS_OUTPUT_DIR: /tmp/voice-service
      
      # Streaming Configuration
      VAD_AGGRESSIVENESS: 2
      SILENCE_THRESHOLD_MS: 800
      MIN_UTTERANCE_DURATION_MS: 500
      STREAMING_BUFFER_DURATION_MS: 4000
      
      # GPU Optimization
      ENABLE_GPU_OPTIMIZATION: "false"
    volumes:
      - voice-cache:/root/.cache  # Cache models between runs
      - ./services/voice-service:/app  # Hot reload for development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - sovereign-network

  model-manager:
    build:
      context: ./services/model-manager
    ports:
      - "8002:8002"
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sovereign-network

