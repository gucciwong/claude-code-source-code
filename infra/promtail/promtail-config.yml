# W6-T18 — Tail every Sovereign container's stdout/stderr into Loki.
# Each service emits JSON lines via _shared/logging; we extract the
# `service`, `level`, and `request_id` fields as Loki labels so we can
# pivot by user-session in Grafana.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sovereign-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        # Only scrape containers we explicitly tag — keeps noise out.
        filters:
          - name: name
            values:
              - "sovereign-*"
              - "model-manager"
              - "training-service"
              - "enterprise-data-service"
              - "execution-trace-service"
              - "knowledge-service"
              - "orchestration-service"
              - "code-completion-service"
              - "federation-service"
              - "analytics-service"
              - "memory-service"
              - "award-service"
              - "messaging-bridge-service"
              - "org-intelligence-service"
              - "persona-council-service"
              - "plugin-registry-service"
              - "pr-review-service"
              - "semantic-search-service"
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - target_label: job
        replacement: sovereign
    pipeline_stages:
      - json:
          expressions:
            service: service
            level:   level
            request_id: request_id
            logger:  logger
            msg:     msg
      - labels:
          service:
          level:
          request_id:
